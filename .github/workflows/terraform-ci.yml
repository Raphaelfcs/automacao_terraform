# Painel único com os três provedores: cada um roda a sua esteira (_terraform-provedor.yml)
# em paralelo e aparece como um bloco próprio no grafo do run (AWS, Google Cloud, Azure).
#
# - pull_request: só roda o provedor cuja pasta mudou (os outros aparecem como "skipped").
#   Mudança em arquivo compartilhado (.github/, .tflint.hcl, Makefile) roda todos.
# - push na main: roda todos, para a main estar sempre verificada de ponta a ponta.
# - manual (workflow_dispatch): escolhe um provedor ou todos.
# - O job "resultado" consolida tudo e é o check a exigir na proteção de branch.
name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provedor:
        description: "Provedor a verificar"
        type: choice
        options: [todos, aws, gcp, azure]
        default: todos

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mudancas:
    name: o que mudou
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.filtro.outputs.aws }}
      gcp: ${{ steps.filtro.outputs.gcp }}
      azure: ${{ steps.filtro.outputs.azure }}
      repositorio: ${{ steps.filtro.outputs.repositorio }}
      apps: ${{ steps.filtro.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          ESCOLHA: ${{ inputs.provedor }}
          BASE: ${{ github.base_ref }}
        run: |
          todos() { for p in aws gcp azure repositorio apps; do echo "$p=$1" >> "$GITHUB_OUTPUT"; done; }

          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$ESCOLHA" != "todos" ]; then
            todos false; echo "$ESCOLHA=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENTO" != "pull_request" ]; then todos true; exit 0; fi

          arquivos=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$arquivos"
          if echo "$arquivos" | grep -qE '^(\.github/|\.tflint\.hcl$|Makefile$)'; then todos true; exit 0; fi
          for p in aws gcp azure; do
            echo "$p=$(echo "$arquivos" | grep -q "^$p/" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          done
          echo "repositorio=$(echo "$arquivos" | grep -qE '^(labs|padrao-iac)/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # apps usam os módulos de aws/ e gcp/: mudança neles também valida os apps
          echo "apps=$(echo "$arquivos" | grep -qE '^(apps|aws|gcp)/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  aws:
    name: AWS
    needs: mudancas
    if: needs.mudancas.outputs.aws == 'true'
    uses: ./.github/workflows/_terraform-provedor.yml
    with:
      provedor: aws

  gcp:
    name: Google Cloud
    needs: mudancas
    if: needs.mudancas.outputs.gcp == 'true'
    uses: ./.github/workflows/_terraform-provedor.yml
    with:
      provedor: gcp

  azure:
    name: Azure
    needs: mudancas
    if: needs.mudancas.outputs.azure == 'true'
    uses: ./.github/workflows/_terraform-provedor.yml
    with:
      provedor: azure

  # Labs e o padrão de IaC não são módulos publicados: entram só em fmt e lint.
  repositorio:
    name: labs e padrao-iac
    needs: mudancas
    if: needs.mudancas.outputs.repositorio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -recursive -check -diff labs padrao-iac
      - uses: terraform-linters/setup-tflint@v4
      - run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --chdir=labs --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --chdir=padrao-iac --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Apps completos (código + roots por ambiente): testes do app, fmt, lint e validate de cada root.
  apps:
    name: apps
    needs: mudancas
    if: needs.mudancas.outputs.apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: testes do app docs-pacientes
        working-directory: apps/docs-pacientes/app
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -recursive -check -diff apps
      - name: validate dos roots
        run: |
          for root in $(find apps -name provider.tf -path '*/infra/*' -exec dirname {} \; | sort); do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --chdir=apps --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  resultado:
    name: resultado
    needs: [mudancas, aws, gcp, azure, repositorio, apps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTADOS: ${{ toJson(needs) }}
        run: |
          echo "| contexto | resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTADOS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTADOS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::Pelo menos um provedor falhou."; exit 1
          fi
